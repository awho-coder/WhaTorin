<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhaTorin WSP</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --accent-color: #4facfe;
            --text-color: #ffffff;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        button, .profile-select {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: var(--text-color);
            padding: 5px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s ease;
            outline: none;
        }
        button:hover, .profile-select:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.2);
        }
        button.active {
            background: var(--accent-color);
            color: #000;
            border-color: var(--accent-color);
            font-weight: bold;
        }
        #wa-webview {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            transition: filter 220ms ease;
        }
        #floating-menu {
            position: fixed;
            top: 14px;
            right: 14px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 8px;
        }
        #btn-open-menu {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            padding: 0;
            font-size: 18px;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }
        #menu-panel {
            display: none;
            min-width: 220px;
            padding: 10px;
            border-radius: 10px;
            background: rgba(10, 10, 16, 0.95);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
        }
        #menu-panel.open {
            display: grid;
            gap: 8px;
        }
        .menu-title {
            font-size: 11px;
            color: #b7b7b7;
            letter-spacing: 0.3px;
            margin: 0 0 2px 2px;
            user-select: none;
        }
        .menu-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #444;
            display: inline-block;
        }
        .status-dot.online { background: #4caf50; }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%) translateY(10px);
            background: rgba(8, 8, 12, 0.94);
            border: 1px solid rgba(255, 255, 255, 0.16);
            color: #fff;
            font-size: 12px;
            padding: 8px 12px;
            border-radius: 8px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 180ms ease, transform 180ms ease;
            z-index: 10000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        body.easter-mode #wa-webview {
            filter: hue-rotate(132deg) saturate(1.3) contrast(1.05);
        }

        body.easter-mode #btn-open-menu {
            box-shadow: 0 0 0 1px rgba(102, 240, 176, 0.35), 0 0 20px rgba(102, 240, 176, 0.25);
        }
    </style>
</head>
<body>
    <webview
        id="wa-webview"
        src="https://web.whatsapp.com"
        partition="persist:profile-a"
        useragent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36">
    </webview>

    <div id="floating-menu">
        <button id="btn-open-menu" aria-label="Opciones">⚙</button>
        <div id="menu-panel">
            <p class="menu-title">
                <span id="status-dot" class="status-dot online"></span>
                WhaTorin WSP
            </p>
            <select id="select-profile" class="profile-select">
                <option value="persist:profile-a">Perfil Principal</option>
                <option value="persist:profile-b">Perfil Secundario</option>
            </select>
            <div class="menu-actions">
                <button id="btn-refresh">🔄 Recargar</button>
                <button id="btn-dev-tools">🛠 DevTools</button>
            </div>
            <button id="btn-toggle-theme" class="active">✨ Tema: ON</button>
        </div>
    </div>
    <script src="./renderer.js"></script>
</body>
</html>
